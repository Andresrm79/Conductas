    <script>
      // Allow browser extensions and interceptors to safely override window.fetch
      (function() {
        try {
          var _currentFetch = window.fetch;
          var patch = function(target) {
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return _currentFetch;
                },
                set: function(val) {
                  _currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          };
          patch(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            patch(Window.prototype);
          }
        } catch (e) {}

        // Suppress unhandled extension injection errors
        window.addEventListener('error', function(event) {
          if (
            event &&
            (
              (event.message && event.message.indexOf('Cannot set property fetch') !== -1) ||
              (event.filename && event.filename.indexOf('chrome-extension://') !== -1)
            )
          ) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
          }
        }, true);
      })();
    </script>
